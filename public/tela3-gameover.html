<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe Multiplayer — Fim de Jogo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="modal-standalone-body">
  <div class="modal-overlay">
    <div class="modal-card">
      <div class="modal-icon">🏆</div>
      <h2 class="modal-title">VITÓRIA! VOCÊ VENCEU!</h2>
      <p class="modal-subtitle">Excelente desempenho estratégico na partida.</p>

      <div class="modal-stats">
        <div class="modal-stat-box">
          <span class="stat-label">Placar Consolidado</span>
          <span class="stat-value">2 x 1</span>
        </div>
        <div class="modal-stat-box">
          <span class="stat-label">Duração da Partida</span>
          <span class="stat-value">01:14</span>
        </div>
      </div>

      <div class="modal-actions">
        <button onclick="window.location.href='tela2-arena.html'" class="btn btn-green">Solicitar Revanche [WS]</button>
        <button onclick="window.location.href='tela1-lobby.html'" class="btn btn-secondary">Voltar ao Lobby</button>
      </div>
    </div>
  </div>
</body>
</html>
